<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1700" height="1080" fill="#fff"/><text x="24" y="40" font-size="26" fill="#1f2937" text-anchor="start" font-weight="700">C4 level 0 - System landscape: CrowdWatch across an organisation&#x27;s venues</text>
