<text x="850" y="1200.0" font-size="13" fill="#444" text-anchor="middle">Only one program opens a venue&#x27;s database at a time: the server or the desktop console. Level 3 (components of the server): the web-layer diagram. Level 4 (code): the class diagram of the core.</text></svg>