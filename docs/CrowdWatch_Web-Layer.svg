<text x="945.0" y="910" text-anchor="middle" font-size="13" fill="#555">newer endpoints</text>
<text x="840" y="936" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">reports, replay,</text>
<text x="840" y="955" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">messages, privacy</text>
<rect x="1100" y="700" width="480" height="460" rx="14" fill="#f7f9fc" stroke="#9db3cc" stroke-dasharray="8 5" stroke-width="1.6"/>
<text x="1114" y="724" font-size="16" font-weight="700" fill="#4a6a8f">Core and data</text>
<rect x="1120" y="880" width="440" height="120" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
<rect x="1120" y="880" width="440" height="46" fill="#dbe7f5" stroke="#1f4e79" stroke-width="2"/>
<text x="1340.0" y="902" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">CrowdMonitor</text>
<text x="1340.0" y="920" text-anchor="middle" font-size="13" fill="#555">crowdwatch.core  (all methods synchronized)</text>
<text x="1130" y="946" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">rules, dispatch, routes, evacuation;</text>
<text x="1130" y="965" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">listeners on their own event thread</text>
<rect x="1120" y="740" width="440" height="120" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
<rect x="1120" y="740" width="440" height="46" fill="#dbe7f5" stroke="#1f4e79" stroke-width="2"/>
<text x="1340.0" y="762" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">App.Headless</text>
<text x="1340.0" y="780" text-anchor="middle" font-size="13" fill="#555">crowdwatch.gui</text>
<text x="1130" y="806" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">database, accounts, feeds, watchdog,</text>
<text x="1130" y="825" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">autosave every 60 s + SaveSoon</text>
<rect x="1120" y="1020" width="440" height="120" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
<rect x="1120" y="1020" width="440" height="46" fill="#dbe7f5" stroke="#1f4e79" stroke-width="2"/>
<text x="1340.0" y="1042" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">Database  +  SaveSoon</text>
<text x="1340.0" y="1060" text-anchor="middle" font-size="13" fill="#555">crowdwatch.db  -  Apache Derby</text>
<text x="1130" y="1086" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">saves 10 s after a change (and every 60 s);</text>
<text x="1130" y="1105" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">daily backup; personal data AES-256-GCM</text>
<rect x="20" y="1020" width="1060" height="140" rx="14" fill="#f7f9fc" stroke="#9db3cc" stroke-dasharray="8 5" stroke-width="1.6"/>
<text x="34" y="1044" font-size="16" font-weight="700" fill="#4a6a8f">Legend</text>
<line x1="50" y1="1080" x2="120" y2="1080" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="135" y="1085" font-size="14">calls</text>
<line x1="50" y1="1115" x2="120" y2="1115" stroke="#444" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="135" y="1120" font-size="14">notifies (events, WebSocket)</text>
<text x="420" y="1085" font-size="14">A request: CallerFilter (who, rate limit, role) -> controller -> ApiServer -> CrowdMonitor.</text>
<text x="420" y="1110" font-size="14">The JDK server (CrowdWatch.jar --server) calls ApiServer.dispatch() directly,</text>
<text x="420" y="1135" font-size="14">so both servers share the same rules, rights, audit log and data code.</text>
