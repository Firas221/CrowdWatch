<text x="220.0" y="467" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">ConsoleController</text>
<text x="220.0" y="485" text-anchor="middle" font-size="13" fill="#555">16 x @GetMapping</text>
<text x="50" y="511" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">overview, areas, incidents,</text>
<text x="50" y="530" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">units, alerts, venue, layout,</text>
<text x="50" y="549" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">lost, announcements, status,</text>
<text x="50" y="568" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">incident, readings, evacuation,</text>
<text x="50" y="587" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">route, summary, handover</text>
<text x="50" y="606" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">-> ApiServer.read()</text>
