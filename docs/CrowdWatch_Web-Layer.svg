<text x="590" y="936" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">PBKDF2, lockout,</text>
<text x="590" y="955" font-size="13.5" font-family="DejaVu Sans, sans-serif" fill="#222">TOTP, LDAP, audit</text>
