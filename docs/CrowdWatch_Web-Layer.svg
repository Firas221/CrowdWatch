<text x="410.0" y="267" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">SecurityConfig.CallerFilter</text>
<text x="410.0" y="285" text-anchor="middle" font-size="13" fill="#555">Spring Security filter chain</text>
<text x="50" y="311" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">identify: session token, dashboard cookie, control key,</text>
<text x="50" y="330" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">          scout key or device code  -> ApiServer.caller()</text>
<text x="50" y="349" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">rate limit per address (control key exempt), counted once</text>
<text x="50" y="368" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">role check of every endpoint -> ApiServer.refusal()  (401 / 403)</text>
<rect x="810" y="245" width="750" height="160" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
<rect x="810" y="245" width="750" height="46" fill="#dbe7f5" stroke="#1f4e79" stroke-width="2"/>
<text x="1185.0" y="267" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">LiveSocket</text>
<text x="1185.0" y="285" text-anchor="middle" font-size="13" fill="#555">/ws  -  implements MonitorListener</text>
<text x="820" y="311" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">sign-in checked on connect and every 60 s</text>
<text x="820" y="330" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">onChange(): {"type":"change"}  (at most every 300 ms)</text>
<text x="820" y="349" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">onAlert():  {"type":"alert","kind":...}</text>
<text x="820" y="368" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">no venue data: consoles reload through the API</text>
