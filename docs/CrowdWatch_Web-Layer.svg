<text x="1375.0" y="467" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">CrowdWatchServer</text>
<text x="1375.0" y="485" text-anchor="middle" font-size="13" fill="#555">@SpringBootApplication</text>
<text x="1200" y="511" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">main(): same arguments as</text>
<text x="1200" y="530" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">  --server / --drill / --https</text>
<text x="1200" y="549" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">App.prepare() -> Headless</text>
<text x="1200" y="568" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">beans: ApiServer, CrowdMonitor</text>
<text x="1200" y="587" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">HTTPS: App.keyStore()</text>
<rect x="20" y="700" width="1060" height="300" rx="14" fill="#f7f9fc" stroke="#9db3cc" stroke-dasharray="8 5" stroke-width="1.6"/>
<text x="1066" y="724" text-anchor="end" font-size="16" font-weight="700" fill="#4a6a8f">Shared web code  (crowdwatch.net)</text>
