<rect x="40" y="740" width="520" height="46" fill="#dbe7f5" stroke="#1f4e79" stroke-width="2"/>
<text x="300.0" y="762" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">ApiServer</text>
<text x="300.0" y="780" text-anchor="middle" font-size="13" fill="#555">rules, rights and audit for both servers</text>
<text x="50" y="806" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">+dispatch(Exchange)       any endpoint</text>
<text x="50" y="825" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">+read(endpoint, q, type, build)</text>
<text x="50" y="844" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">+act(ex, key, endpoint, params): Outcome</text>
<text x="50" y="863" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">+caller(ex, key): Caller</text>
<text x="50" y="882" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">+refusal(role, endpoint) {static}</text>
<text x="50" y="901" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">-change(endpoint, q): Result   22 changes</text>
<text x="50" y="920" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">-permit(): device only for its own unit</text>
<text x="50" y="939" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">-audit(): every change and refusal</text>
<text x="50" y="958" font-size="13.5" font-family="DejaVu Sans Mono, monospace" fill="#222">+start(port, tls)  JDK HttpServer</text>
