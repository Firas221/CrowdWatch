# Settings for running CrowdWatch as a service (started when the computer starts).
# Used by install-service-linux.sh, install-service-mac.sh and install-service-windows.bat.
VENUE=airport
PORT=8080
# CONTROL_KEY and SCOUT_KEY may stay empty when personal logins are used (add-user)
CONTROL_KEY=
SCOUT_KEY=
# 1 for HTTPS
CROWDWATCH_HTTPS=
