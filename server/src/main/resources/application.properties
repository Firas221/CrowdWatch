# CrowdWatch on Spring Boot. The port, HTTPS and the venue come from the command line
# (see CrowdWatchServer); these are the fixed settings.
spring.main.banner-mode=off
spring.application.name=crowdwatch
# requests are answered by the CrowdWatch API, which has its own size limits (64 KB, 3 MB for photos)
server.tomcat.max-swallow-size=4MB
server.tomcat.connection-timeout=5s
server.tomcat.threads.max=400
server.tomcat.accept-count=1024
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/plain
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
# the operators read CrowdWatch's own messages on the console; Spring and Tomcat speak up only for problems
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{30} - %msg%n
