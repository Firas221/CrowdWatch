# Pushing a tag such as v2.0 (or running this workflow by hand with a version) builds CrowdWatch,
# runs the tests and publishes a GitHub release with the ready-to-run package (program, source,
# docs, examples) attached as a zip. Run by hand, the tag is created on the commit that was built.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v2.0'
        required: true
        default: 'v2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and test
        run: ./build.sh
      - name: Build and test the Spring Boot server with the React console
        run: ./build-spring.sh
      - name: Package
        run: |
          NAME="CrowdWatch-${TAG}"
          mkdir -p "dist/$NAME"
          cp -R program source server web docs examples README.md README.txt LICENSE "dist/$NAME/"
          [ -d screenshots ] && cp -R screenshots "dist/$NAME/" || true
          rm -rf "dist/$NAME/program/build" "dist/$NAME/program/crowdwatch-data" "dist/$NAME/web/node_modules" "dist/$NAME/server/target" "dist/$NAME/server/src/main/resources/static"
          (cd dist && zip -qr "$NAME.zip" "$NAME")
          echo "ZIP=dist/$NAME.zip" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "CrowdWatch $TAG" \
            --notes "Ready-to-run package: unzip, run program/run-server.bat (or run-server.sh) and open http://localhost:8080/ for the control room console (Spring Boot server with the React console and live updates). program/run.bat (run.sh) starts the desktop console. Needs Java 17 or newer. See README.md and docs/ for the guide." \
            || gh release upload "$TAG" "$ZIP" --clobber
