# One-off maintenance: deletes a GitHub release and its tag (run by hand).
name: Delete release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to delete, e.g. v2.0'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
