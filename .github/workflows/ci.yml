# Builds CrowdWatch and runs the automatic tests on every push and pull request.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-${{ matrix.os }}
          path: build/test-output.txt
          if-no-files-found: ignore

  # the Spring Boot server with the React console (Java core compiled from source/src unchanged)
  spring:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./build-spring.sh
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build-spring.bat
